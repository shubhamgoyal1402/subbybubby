<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>For You</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Caveat:wght@500&family=Kalam:wght@400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg1: #fdecd2;
      --bg2: #f4c9a6;
      --red: #7a1218;
      --ink: #3b2a2a
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: 'Caveat', cursive;
      color: var(--ink);
      background: linear-gradient(#fdecd2, #f5cfae);
      overflow-x: hidden
    }

    .screen {
      display: none;
      min-height: 100%;
      position: relative
    }

    .screen.on {
      display: block;
      animation: fade .8s
    }

    @keyframes fade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    h1,
    .script {
      font-family: 'Dancing Script', cursive;
      color: var(--red)
    }

    /* intro roses */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: linear-gradient(#fdecd2, #f9dcc0);
      overflow: hidden;
      transition: opacity 1.2s
    }

    #intro.out {
      opacity: 0;
      pointer-events: none
    }

    .rose {
      position: absolute;
      border-radius: 50%;
      top: -80px;
      animation: fall linear forwards;
      box-shadow: inset -4px -4px 8px rgba(0, 0, 0, .15), inset 4px 4px 8px rgba(255, 255, 255, .4)
    }

    @keyframes fall {
      to {
        transform: translateY(115vh) rotate(260deg)
      }
    }

    /* story */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px
    }

    .hero h1 {
      font-size: clamp(2.6rem, 9vw, 4.5rem)
    }

    .hero p {
      font-size: 1.3rem;
      margin-top: 6px;
      color: #6b3b3b
    }

    .cover {
      width: min(260px, 70vw);
      margin-top: 26px;
      border-radius: 14px
    }

    .cover-fb {
      font-size: 5rem;
      margin-top: 20px
    }

    .poem {
      max-width: 440px;
      margin: 0 auto;
      padding: 26px 30px;
      background: rgba(255, 255, 255, .55);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(120, 60, 40, .15);
      font-size: 1.6rem;
      line-height: 1.7;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      transition: 1s
    }

    .poem.show {
      opacity: 1;
      transform: none
    }

    .hl {
      padding: 0 4px;
      border-radius: 4px
    }

    .p {
      background: #f7b9c4
    }

    .g {
      background: #bfe0b5
    }

    .y {
      background: #f4d594
    }

    .sect {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px
    }

    .lock {
      text-align: center;
      cursor: pointer
    }

    .lock .ic {
      font-size: 3.4rem;
      filter: drop-shadow(0 4px 8px rgba(200, 100, 60, .4));
      animation: pulse 2s infinite
    }

    .lock small {
      display: block;
      font-size: .9rem;
      margin-top: 8px;
      color: #a0705a
    }

    @keyframes pulse {
      50% {
        transform: scale(1.12)
      }
    }

    /* keypad */
    #pad {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: linear-gradient(#fdecd2, #f4c9a6);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    #pad.on {
      display: flex;
      animation: fade .5s
    }

    #pad .x {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 1.6rem;
      cursor: pointer;
      background: none;
      border: 0;
      color: #a0705a
    }

    #pad h2 {
      font-family: 'Dancing Script';
      color: var(--red);
      font-size: 2rem;
      margin: 8px 0 14px
    }

    .dots {
      display: flex;
      gap: 14px;
      margin-bottom: 22px
    }

    .dots i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid #b89a8a
    }

    .dots i.f {
      background: #1f6b3a;
      border-color: #1f6b3a
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      gap: 14px
    }

    .keys button {
      height: 64px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .55);
      font: 1.5rem 'Dancing Script';
      color: #5a3a3a;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .08);
      cursor: pointer
    }

    .keys button:active {
      background: #f7d8c4
    }

    .keys .z {
      grid-column: 2
    }

    .shake {
      animation: sh .4s
    }

    @keyframes sh {
      25% {
        transform: translateX(-10px)
      }

      75% {
        transform: translateX(10px)
      }
    }

    /* loading */
    #load {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: radial-gradient(#fff4e4, #f6d6b8);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column
    }

    #load.on {
      display: flex
    }

    .ring {
      position: relative;
      width: 90px;
      height: 90px;
      animation: spin 3s linear infinite
    }

    .ring b {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      left: 30px;
      top: 30px
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    #load small {
      margin-top: 30px;
      letter-spacing: 4px;
      font-size: .7rem;
      color: #b08a7a
    }

    /* gallery */
    .back {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 20;
      background: rgba(255, 255, 255, .7);
      border: 0;
      border-radius: 20px;
      padding: 5px 12px;
      font: .95rem 'Caveat';
      cursor: pointer
    }

    .wall {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      padding: 50px 16px 20px;
      max-width: 900px;
      margin: auto
    }

    @media(min-width:700px) {
      .wall {
        grid-template-columns: repeat(3, 1fr);
        gap: 26px
      }
    }

    .pol {
      perspective: 900px;
      transition: transform .3s
    }

    .pol .inner {
      display: grid;
      transform-style: preserve-3d;
      transition: transform .7s
    }

    .pol .face {
      grid-area: 1/1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: #fff7f5;
      padding: 8px 8px 22px;
      box-shadow: 0 6px 16px rgba(80, 40, 30, .25)
    }

    .pol .face.note {
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #fdf1e6;
      padding: 16px;
      font: 1.1rem/1.5 'Kalam', cursive;
      color: #5a2d2d
    }

    .pol.flip .inner {
      transform: rotateY(180deg)
    }

    @media(hover:hover) {
      .pol:hover {
        z-index: 5
      }

      .pol:hover .inner {
        transform: rotateY(180deg)
      }
    }

    .wall {
      align-items: start
    }

    .pol.l img,
    .pol.l .ph {
      aspect-ratio: 4/3
    }

    .pol img,
    .pol .ph {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #f4c1c9, #f6dcb0)
    }

    .letter {
      max-width: 480px;
      margin: 50px auto 0;
      padding: 30px 26px;
      background: linear-gradient(#fbeee6, #f6d9cc);
      box-shadow: 0 14px 34px rgba(100, 50, 40, .25);
      font: 1.1rem/1.75 'Kalam', cursive;
      min-height: 240px
    }

    .hrt {
      text-align: center;
      color: #c0525a;
      margin: 26px 0
    }

    .fin {
      text-align: center;
      padding: 10px 20px 90px;
      opacity: 0;
      transition: 2s
    }

    .fin.show {
      opacity: 1
    }

    .fin .script {
      font-size: clamp(2.4rem, 9vw, 3.6rem)
    }

    .fin p {
      font-size: 1.2rem;
      margin-top: 4px
    }

    /* gift */
    #gift {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      background: #fbece4;
      cursor: pointer
    }

    #gift.on {
      display: flex
    }

    #gift .box {
      font-size: 7rem;
      animation: pulse 2.5s infinite
    }

    #gift h2 {
      font: 700 1.8rem 'Dancing Script';
      color: var(--red)
    }
  </style>
</head>

<body>

  <div id="intro"></div>

  <!-- Page 1: story -->
  <div class="screen on" id="story">
    <div class="hero">
      <h1>From me to you.</h1>
      <p>This is how much I love you.</p>
      <img class="cover" src="photos/cover.jpg" alt="" onerror="this.outerHTML='<div class=cover-fb>👩‍❤️‍👨</div>'">
    </div>
    <div class="sect">
      <div class="poem" id="poem">
        In your <span class="hl p">smile</span>, I found my <span class="hl g">peace</span>.<br>
        In your <span class="hl p">love</span>, I found my <span class="hl y">dream</span>.
      </div>
    </div>
    <div class="sect">
      <div class="lock" id="lockBtn">
        <div class="ic">🔒</div><small>tap to open</small>
      </div>
    </div>
  </div>

  <!-- Keypad -->
  <div id="pad">
    <button class="x" id="padX">✕</button>
    <div style="font-size:2.4rem">🔒</div>
    <h2>Enter Passkey</h2>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="keys"></div>
  </div>

  <div id="load">
    <div class="ring" id="ring"></div><small>LOADING</small>
  </div>

  <!-- Page 2: gallery + letter -->
  <div class="screen" id="memories">
    <button class="back" id="backBtn">‹ Back</button>
    <div class="wall" id="wall"></div>
    <div class="letter" id="letter"></div>
    <div class="hrt">♡</div>
    <div class="fin" id="fin">
      <div class="script">I will always love you</div>
      <p>From, your forever</p>
    </div>
  </div>

  <!-- Gift page -->
  <div id="gift">
    <div class="box">🎁</div>
    <h2>For you, my baby.</h2><small style="color:#b0806a">(tap to open)</small>
  </div>

  <script>
    /* ====== EDIT THESE ====== */
    const PASSCODE = "1608";
    const PHOTO_COUNT = 9;                 // photos/1.jpg ... photos/9.jpg
    // p = portrait, l = landscape (one letter per photo, in order). Below: 4 portrait + 5 landscape
    // Note shown on the back of each photo (hover on computer / tap on phone). Edit freely.
    const NOTES = [
      "Our First Date Matchbox and summerhouse. I was so happy to see you for the first time.",
      "Our First Concert: Papon, I asked her out. I so wanted to be her boyfriend",
      "Our First Carnival, I was scared but i had you besides me on the rides",
      "I love how goofy we are looking in this. I am so in love.",
      "Third Wave, I love our conversations, makes me feel so calm. I can be myself and share how i feel and be vulnerable.",
      "Diljit Concert, Very tiring and fun day. I was so whiny at the end, dont want to leave you ever babe.",
      "I want to always lay down with you, keep you in my arms and close to my heart shonaa",
      "Love how serious we are for each other, I mean look at the photo",
      "Easygoing date nights, where I feel that you are my peace, I love you"
    ];
    const ORIENT = ['p', 'l', 'p', 'l', 'l', 'p', 'l', 'p', 'l'];
    const LETTER = "Heyy redd, I know you are alseep and probably aaj aapka mood bhi mene thoda sa upar neeche kar diya, but i really love you shona. These three months have been nothing but a grace to me, i am so happy and calm. I love how you are bringing the best out of me. And the universe is also returning mee back. There are things i wanna say and things i dont wanna say, i want you to hear them both. I love how you think of me and take care of me. The level of respect i get from you i am v happy. Because of you I finally feel so calm and contained as i said best out of me.Shona Every thing i do is straight from heart and all love. I love how you have given me the privilege and chance to bond w your lil sister. I so waana adore you and make you feel never regret. My appraisal came when you came in my Life , i so much wanted to do for you, i wanna work for you. My actions should be all in favor of you. You are an angel for being such a wonderful person to me.I loved your gift. The zine is so close to my heart. These are the things i wanna preserve and then look after we are married for 20 yrs. i wanna be so stupid and so in love w uou.Shona, I so much want you in my life. I want you to have a good relationship w my family and same for you. I want them to adore you and know you. I wish i can always stay beside you in peace and chaos. Simran i really really love you. I am at my highest when i am with you. Suddenly things gets so easier when i see your face and hear your voice.On the occasion of three months, I am coming for you Miss simran kaur. And I am gonna take you with me. I love you with all my heart and body. My tenant who lives so much in my head. I love how you sing the lyrics and see you are so happy , I can be myself and vulnerable too. I respect you so much for creating that comfort for me. Thank you for everything, I love you shona";
    /* ======================== */
    const $ = id => document.getElementById(id);
    const show = id => { document.querySelectorAll('.screen,#gift').forEach(e => e.classList.remove('on')); $(id).classList.add('on'); scrollTo(0, 0) };

    // falling roses intro
    const cols = ['#f08aa3', '#e8896a', '#fdf6ec', '#f4a3b5', '#d9704f'];
    const intro = $('intro');
    for (let i = 0; i < 140; i++) {
      const r = document.createElement('div'); r.className = 'rose'; const s = 50 + Math.random() * 50;
      r.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;background:radial-gradient(circle at 35% 35%,#fff8,transparent 40%),${cols[i % 5]};animation-duration:${3 + Math.random() * 2.5}s;animation-delay:${Math.random() * 3}s`;
      intro.appendChild(r)
    }
    setTimeout(() => intro.classList.add('out'), 6200);
    setTimeout(() => intro.remove(), 7600);

    // poem reveal
    new IntersectionObserver((e, o) => e.forEach(x => { if (x.isIntersecting) { x.target.classList.add('show'); } }), { threshold: .5 }).observe($('poem'));

    // keypad
    let code = "";
    const keys = $('keys');
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'Clear'].forEach(k => {
      const b = document.createElement('button'); b.textContent = k; if (k === '0') b.className = 'z';
      if (k === 'Clear') { b.style.fontSize = '.95rem'; b.onclick = () => { code = ""; draw() } } else b.onclick = () => press(k);
      keys.appendChild(b)
    });
    function draw() { [...$('dots').children].forEach((d, i) => d.classList.toggle('f', i < code.length)) }
    function press(k) {
      if (code.length >= 4) return; code += k; draw();
      if (code.length === 4) setTimeout(() => {
        if (code === PASSCODE) { $('pad').classList.remove('on'); openMemories() }
        else { $('dots').classList.add('shake'); setTimeout(() => { $('dots').classList.remove('shake'); code = ""; draw() }, 450) }
      }, 250)
    }
    $('lockBtn').onclick = () => { code = ""; draw(); $('pad').classList.add('on') };
    $('padX').onclick = () => $('pad').classList.remove('on');

    // loading ring
    const ring = $('ring');
    for (let i = 0; i < 6; i++) {
      const b = document.createElement('b'); const a = i * 60 * Math.PI / 180;
      b.style.transform = `translate(${Math.cos(a) * 34}px,${Math.sin(a) * 34}px)`;
      b.style.background = i % 2 ? 'radial-gradient(circle at 35% 35%,#fff8,transparent 40%),#f08aa3' : 'radial-gradient(circle at 35% 35%,#fff8,transparent 40%),#fdf6ec';
      b.style.boxShadow = '0 2px 6px rgba(0,0,0,.2)'; ring.appendChild(b)
    }

    // polaroid wall
    const wall = $('wall');
    for (let i = 1; i <= PHOTO_COUNT; i++) {
      const d = document.createElement('div'); d.className = 'pol ' + (ORIENT[i - 1] || 'p');
      const rot = ((i * 37) % 13) - 6; d.style.transform = `rotate(${rot}deg) translateY(${(i % 3) * 8}px)`;
      d.innerHTML = `<div class="inner"><div class="face"><img src="photos/${i}.jpg" alt="" onerror="this.outerHTML='<div class=ph></div>'"></div><div class="face note"></div></div>`;
      d.querySelector('.note').textContent = NOTES[i - 1] || '';
      d.onclick = () => { if (matchMedia('(hover:none)').matches) d.classList.toggle('flip') };
      wall.appendChild(d)
    }

    // typewriter
    let typed = false;
    function typeLetter() {
      if (typed) return; typed = true; const el = $('letter'); let i = 0;
      (function t() { el.textContent = LETTER.slice(0, ++i); if (i < LETTER.length) setTimeout(t, 22); else $('fin').classList.add('show') })()
    }
    new IntersectionObserver(e => e.forEach(x => x.isIntersecting && typeLetter()), { threshold: .3 }).observe($('letter'));

    function openMemories() { $('load').classList.add('on'); setTimeout(() => { $('load').classList.remove('on'); show('memories') }, 2800) }
    $('backBtn').onclick = () => show('gift'.length ? 'gift' : 'story');
    $('gift').onclick = () => show('memories');
  </script>
</body>

</html>
